# Postgres de desarrollo. La API y el panel corren con `pnpm dev`.
#   docker compose up -d postgres
# Puerto del host: 5499 (cámbialo con DB_PORT=xxxx si está ocupado).
name: gestor-ventas-mcp-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestor_ventas
    ports:
      - "127.0.0.1:${DB_PORT:-5499}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestor_ventas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
